name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Pin Xcode 16.4 (deterministic SDK)
        run: |
          [ -d /Applications/Xcode_16.4.app ] || { echo "Xcode_16.4.app missing"; exit 1; }
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Swift version
        run: swift --version

      - name: Install LibreOffice (for PPTX conversion path)
        continue-on-error: true
        run: brew install --cask libreoffice
        # If the cask install fails, the PPTX test skips itself and the
        # PDF-only suite still runs, so the job stays green.

      - name: Build
        run: swift build

      - name: Test
        env:
          FILE_CONVERTER_ARTIFACTS: ${{ runner.temp }}/test-artifacts
        run: swift test 2>&1 | tee test-output.txt

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: |
            test-output.txt
            ${{ runner.temp }}/test-artifacts/**/*.jpg
          if-no-files-found: warn