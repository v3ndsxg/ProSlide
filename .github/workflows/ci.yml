name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Install LibreOffice (for PPTX conversion path)
        run: brew install --cask libreoffice
        # If the cask install fails, the PPTX test skips itself and the
        # PDF-only suite still runs, so the job stays green.

      - name: Build
        run: swift build

      - name: Test
        run: swift test