name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs (not moving tags) for supply-chain hygiene.
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Pin Xcode 16.4 (deterministic SDK)
        run: |
          [ -d /Applications/Xcode_16.4.app ] || { echo "Xcode_16.4.app missing"; exit 1; }
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Swift version
        run: swift --version

      - name: Install LibreOffice (for PPTX conversion path)
        continue-on-error: true
        run: brew install --cask libreoffice
        # If the cask install fails, the PPTX test skips itself and the
        # PDF-only suite still runs, so the job stays green.

      - name: Build
        run: swift build

      - name: Test
        env:
          FILE_CONVERTER_ARTIFACTS: ${{ runner.temp }}/test-artifacts
        run: swift test 2>&1 | tee test-output.txt

      - name: Upload test artifacts
        if: always()
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-artifacts
          path: |
            test-output.txt
            ${{ runner.temp }}/test-artifacts/**/*.jpg
          if-no-files-found: warn