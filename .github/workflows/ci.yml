name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs (not moving tags) for supply-chain hygiene.
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Nothing in this job pushes, so the token isn't left in .git/config
          # for the later steps.
          persist-credentials: false

      - name: Pin Xcode 16.4 (deterministic SDK)
        run: |
          [ -d /Applications/Xcode_16.4.app ] || { echo "Xcode_16.4.app missing"; exit 1; }
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Swift version
        run: swift --version

      - name: Install LibreOffice (for PPTX conversion path)
        continue-on-error: true
        run: brew install --cask libreoffice
        # If the cask install fails, the PPTX test skips itself and the
        # PDF-only suite still runs, so the job stays green.

      - name: Build and package the app
        # This is the same path a user takes to install ProSlide, so it also
        # catches a file under App/ProSlide being added or renamed without
        # being registered in the ProSlideApp target in Package.swift.
        #
        # App/ProSlide.xcodeproj is development-only (breakpoints and previews)
        # and is no longer built here; a hand-maintained pbxproj is exactly the
        # kind of file that breaks silently.
        #
        # Both variants are built and checked: this branch's default (the beta)
        # and the production app, so a change to the script can't quietly break
        # the build that ships from main.
        run: |
          check_app() {
            local name="$1" id="$2" folder="$3" beta="$4"
            local APP="build/$name.app"
            test -x "$APP/Contents/MacOS/ProSlide" || { echo "$name: missing executable"; exit 1; }
            plutil -lint "$APP/Contents/Info.plist"
            test -f "$APP/Contents/Resources/ProSlide.icns" || { echo "$name: missing icon"; exit 1; }
            plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$APP/Contents/Info.plist"; }
            test "$(plist CFBundlePackageType)" = APPL || { echo "$name: not an app bundle"; exit 1; }
            test "$(plist CFBundleExecutable)" = ProSlide || { echo "$name: wrong executable name"; exit 1; }
            test "$(plist CFBundleDisplayName)" = "$name" || { echo "$name: wrong display name"; exit 1; }
            test "$(plist CFBundleIdentifier)" = "$id" || { echo "$name: wrong bundle id"; exit 1; }
            test "$(plist ProSlideDataFolder)" = "$folder" || { echo "$name: wrong data folder"; exit 1; }
            test "$(plist ProSlideIsBeta)" = "$beta" || { echo "$name: wrong beta flag"; exit 1; }
            for tool in yt-dlp ffmpeg deno; do
              test -x "$APP/Contents/Resources/Tools/$tool" || { echo "$name: missing tool $tool"; exit 1; }
            done
            test -f "$APP/Contents/Resources/Tools/THIRD_PARTY_NOTICES.txt" || { echo "$name: missing notices"; exit 1; }
            codesign --verify "$APP"
            codesign -dv "$APP" 2>&1 | sed -n '1,4p'
            du -sh "$APP"
          }

          ./Scripts/make-app-bundle.sh release
          check_app "ProSlide Beta" com.v3ndsxg.proslide.beta "ProSlide Beta" true

          ./Scripts/make-app-bundle.sh release --stable
          check_app "ProSlide" com.v3ndsxg.proslide ProSlide false
          # The two builds must be able to sit side by side.
          test -d "build/ProSlide Beta.app" || { echo "beta bundle missing after the stable build"; exit 1; }

      - name: Run the packaged download tools
        # Runs each tool from inside the packaged app, so a signing or
        # quarantine problem shows up here rather than on a Mac. Nothing here
        # touches the internet; the tools only look at files and run code locally.
        shell: bash
        run: |
          TOOLS="$PWD/build/ProSlide Beta.app/Contents/Resources/Tools"

          pinned() { awk -v n="$1" '$1 == n { print $2 }' Scripts/tools.lock; }
          got="$("$TOOLS/yt-dlp" --version)"
          echo "yt-dlp $got"
          test "$got" = "$(pinned yt-dlp)" || { echo "yt-dlp is not the pinned version"; exit 1; }

          ffmpeg_version="$("$TOOLS/ffmpeg" -hide_banner -version)"
          echo "${ffmpeg_version%%$'\n'*}"
          deno_version="$("$TOOLS/deno" --version)"
          echo "${deno_version%%$'\n'*}"
          test "$("$TOOLS/deno" eval 'console.log(6 * 7)')" = 42 || { echo "deno could not run code"; exit 1; }

          encoders="$("$TOOLS/ffmpeg" -hide_banner -encoders)"
          for encoder in libx264 libmp3lame libvpx-vp9 libopus; do
            grep -q "$encoder" <<<"$encoders" || { echo "ffmpeg lacks $encoder"; exit 1; }
          done
          # The Mac's own H.264 encoder is what 4K conversion prefers. A runner
          # may not offer it, which is why the engine can fall back to libx264.
          if grep -q h264_videotoolbox <<<"$encoders"; then
            if "$TOOLS/ffmpeg" -hide_banner -loglevel error -y -f lavfi -i testsrc=duration=1:size=320x240:rate=15 \
                 -c:v h264_videotoolbox -b:v 2M "$RUNNER_TEMP/vt.mp4"; then
              echo "h264_videotoolbox works on this runner"
            else
              echo "::warning title=Hardware encoder unavailable::h264_videotoolbox is listed but would not encode on this runner; 4K conversion would use libx264 here."
            fi
          else
            echo "::warning title=Hardware encoder missing::This ffmpeg has no h264_videotoolbox."
          fi

      - name: Test
        # `shell: bash` implies -eo pipefail. Without it the pipeline's exit
        # status is tee's (always 0), so a test target that fails to compile
        # still reports success — which is how a broken ConversionQueueTests
        # typealias went unnoticed for many commits. Never pipe swift test into
        # tee again without this.
        #
        # The output is written beside the JPEGs and bundles, so the uploaded
        # artifact opens straight onto them rather than onto runner paths.
        shell: bash
        env:
          FILE_CONVERTER_ARTIFACTS: ${{ runner.temp }}/test-artifacts
          # Lets RealToolsTests run the engine against the packaged tools.
          PROSLIDE_TOOLS_DIR: ${{ github.workspace }}/build/ProSlide Beta.app/Contents/Resources/Tools
        run: |
          mkdir -p "$FILE_CONVERTER_ARTIFACTS"
          swift test 2>&1 | tee "$FILE_CONVERTER_ARTIFACTS/test-output.txt"

      - name: Check the bundles the tests built
        # The bundle tests copy each real bundle they build (from sample.pdf,
        # and from sample.pptx and sample.ppt when LibreOffice installed) into
        # bundles/<kind>/. The checker is plain Python that shares no code with
        # the Swift writer, so it can't repeat the writer's mistakes. It runs
        # even when a test failed, since a bad bundle is often why.
        #
        # The PDF bundle is required: without LibreOffice the others are
        # skipped, but a missing PDF bundle means the export itself broke. A
        # missing PowerPoint bundle only warns, so a failed LibreOffice install
        # still shows on the run page instead of passing in silence.
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BUNDLES: ${{ runner.temp }}/test-artifacts/bundles
        run: |
          test -f "$BUNDLES/pdf/sample.probundle" || { echo "the PDF bundle was not exported"; exit 1; }
          for kind in pptx ppt; do
            test -f "$BUNDLES/$kind/sample.probundle" ||
              echo "::warning title=PowerPoint path not checked::No $kind bundle was built, probably because LibreOffice did not install. Only the PDF path was tested."
          done
          python3 -I Scripts/check-probundle.py "$BUNDLES"

      - name: Upload test artifacts
        if: always()
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-artifacts
          path: |
            ${{ runner.temp }}/test-artifacts/test-output.txt
            ${{ runner.temp }}/test-artifacts/**/*.jpg
            ${{ runner.temp }}/test-artifacts/bundles/**/*.probundle
          if-no-files-found: warn