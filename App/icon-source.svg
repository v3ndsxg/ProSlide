<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2f8f"/>
      <stop offset="0.55" stop-color="#5b45c9"/>
      <stop offset="1" stop-color="#2b6fd4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="picture" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efeafd"/>
      <stop offset="1" stop-color="#d9e6fb"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b45c9"/>
      <stop offset="1" stop-color="#2b6fd4"/>
    </linearGradient>
    <clipPath id="frame"><rect x="248" y="430" width="468" height="240" rx="14"/></clipPath>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#14083f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="180" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="180" fill="url(#sheen)"/>

  <!-- the deck: two slides behind, cascading up and to the right -->
  <rect x="314" y="316" width="520" height="292" rx="30" fill="#ffffff" opacity="0.32"/>
  <rect x="270" y="360" width="520" height="292" rx="30" fill="#ffffff" opacity="0.6"/>

  <!-- front slide, holding the image a page becomes -->
  <g filter="url(#lift)">
    <rect x="226" y="404" width="520" height="292" rx="30" fill="#ffffff"/>
  </g>
  <rect x="248" y="430" width="468" height="240" rx="14" fill="url(#picture)"/>
  <g clip-path="url(#frame)">
    <circle cx="640" cy="498" r="30" fill="#5b45c9"/>
    <path d="M248 640 C 330 548 410 548 482 612 C 540 662 596 650 716 580 L716 670 L248 670 Z" fill="#8f80e3"/>
    <path d="M248 670 L248 628 C 340 584 430 606 510 640 C 590 674 660 640 716 612 L716 670 Z" fill="url(#hill)"/>
  </g>
</svg>
