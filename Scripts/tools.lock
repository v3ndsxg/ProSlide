# The download tools packaged into ProSlide.app, pinned to exact stable releases.
# Scripts/fetch-tools.sh downloads each one, refuses to continue unless its
# SHA-256 matches, and make-app-bundle.sh copies them into the app. Apple Silicon only.
#
# To update, run Scripts/update-tools.sh, check its output against each project's
# release page, and change this file in a reviewed pull request.
#
# kind: "file" is the executable itself; "zip" is an archive holding one file
# named after the tool.
